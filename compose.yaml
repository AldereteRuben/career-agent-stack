services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: career
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - career-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  career-postgres:
