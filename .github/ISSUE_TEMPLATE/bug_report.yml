name: Bug report / Reportar un error
description: Report a reproducible problem using fictional data.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "English or Spanish welcome. Do not include CVs, tokens, .env files or private logs. For vulnerabilities, read SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: Version and environment / Versión y entorno
      description: App version, OS, Node/PostgreSQL versions and browser.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / Pasos para reproducir
      description: Use fictional data and describe the smallest repeatable example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / Resultado esperado y real
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / Evidencia sin datos privados
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Privacidad
      options:
        - label: I removed personal data and secrets / Eliminé datos personales y secretos.
          required: true
