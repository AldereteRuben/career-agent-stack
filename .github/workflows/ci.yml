name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: career_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:shared
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm --filter @career/api exec tsc --noEmit --project e2e/tsconfig.json
      - run: pnpm run test:unit
      - name: Verify search relevance and ranking with synthetic cases
        run: pnpm run test:evals
      - name: Verify AI foundations with synthetic processes (no provider account)
        run: pnpm run test:ai
        env:
          CAREER_V090_QUEUE_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          CAREER_V090_ROUTES_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          CAREER_V090_AUTOMATION_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          CAREER_V090_DOCUMENT_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          CAREER_V090_HISTORY_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
      - run: pnpm run test:ui-logic
      - run: pnpm run test:sources
      - name: Verify automatic discovery with fictional sources
        run: pnpm run test:discovery
        env:
          CAREER_DISCOVERY_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
      - name: Verify saved job searches with fictional feeds
        run: pnpm run test:searches
        env:
          CAREER_JOB_SEARCH_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          CAREER_DISCOVERY_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
      # Backups need pg_dump/pg_restore at least as new as the PostgreSQL 17 service; Ubuntu 24.04 ships 16.
      - name: Install the PostgreSQL 17 client tools from the PostgreSQL project
        run: |
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17
      - name: Verify backup restore and the v0.4, v0.8 and v0.9 migrations
        run: pnpm run test:integration
        env:
          CAREER_PG_BIN: /usr/lib/postgresql/17/bin
          CAREER_BACKUP_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          CAREER_V080_MIGRATION_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          CAREER_V090_MIGRATION_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          CAREER_FACT_IMPORT_MIGRATION_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
      - name: Verify resume import with a disposable database
        run: pnpm run test:fact-import
        env:
          CAREER_FACT_IMPORT_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
      - name: Verify bootstrap database creation with a non-superuser administrator
        run: pnpm run test:bootstrap-db
        env:
          CAREER_BOOTSTRAP_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
      - run: pnpm run test:clipboard
      - run: pnpm run test:contributors
      - run: pnpm run test:process
      - run: pnpm run test:backup
      # The official age tool must decrypt a backup with the key file's identity (ADR 019); the flag stops a skip.
      - name: Install the age tool for the backup encryption check
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Verify backup encryption, including decryption with the age tool
        run: pnpm run test:backup-crypto
        env:
          CAREER_AGE_CLI_TEST: '1'
      - run: pnpm run test:backup-api
      - name: Install Chromium for synthetic browser tests
        run: pnpm --filter @career/api exec playwright install --with-deps chromium
      - name: Install PDF text inspection
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Verify reviewed assistant PDFs with fictional content
        run: pnpm --filter @career/api exec tsx --test test/ai-documents.test.ts
        env:
          CAREER_V090_DOCUMENT_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          CAREER_V090_PDF_TEST: 'true'
      - name: Verify preparation with a disposable workspace
        run: pnpm run test:preparation
        env:
          CAREER_PREPARATION_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
      - name: Verify assisted applications against fictional fixtures
        run: pnpm run test:assisted
        env:
          CAREER_ASSIST_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
      - run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  platform-build:
    name: Build and domain tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - name: Verify search relevance and ranking with synthetic cases
        run: pnpm run test:evals
      - name: Verify AI foundations with synthetic processes (no provider account)
        run: pnpm run test:ai
      - run: pnpm run test:ui-logic
      # Includes the private temporary folder check, which uses a user-only ACL on Windows.
      - name: Verify backup encryption on this system
        run: pnpm run test:backup-crypto
  browser:
    # Browser suites on a disposable stack (apps/api/e2e/isolation.ts). They run in parallel with the other jobs.
    # Only fictional fixtures are used; failure screenshots are uploaded for a week. Fork pull requests run with the
    # read-only token and no secrets, like the rest of this workflow.
    name: Browser tests (${{ matrix.id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: e2e
            suite: test:e2e
          - id: edge-cases
            suite: test:edge-cases
          - id: search-ui
            suite: test:search-ui
          - id: ai-ui
            suite: test:ai-ui
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: career_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.10.0
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser suites
        run: pnpm --filter @career/api exec playwright install --with-deps chromium
      - name: Install PDF text inspection
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      # The settings scenario makes a real backup, which needs PostgreSQL 17 pg_dump for the PostgreSQL 17 service.
      - name: Install the PostgreSQL 17 client tools from the PostgreSQL project
        run: |
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17
      # The harness reads DATABASE_URL from .env as the "live" database it must never write to: an empty database
      # on the service. Disposable databases are created and dropped through the maintenance connection.
      - name: Point the harness at the PostgreSQL service
        run: |
          psql postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres --command 'create database career'
          printf 'DATABASE_URL=postgresql://postgres:career_ci_only@127.0.0.1:5432/career\n' > .env
      - name: Run ${{ matrix.suite }} against a production build of the dashboard
        run: pnpm run ${{ matrix.suite }}
        env:
          E2E_PRODUCTION: '1'
          CAREER_PG_BIN: /usr/lib/postgresql/17/bin
          E2E_ADMIN_DATABASE_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload screenshots from the failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.id }}-screenshots
          path: output/playwright/
          retention-days: 7
          if-no-files-found: ignore
