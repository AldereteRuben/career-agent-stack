name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: career_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:shared
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run test:sources
      - run: pnpm run test:backup
      - run: pnpm run test:backup-api
      - name: Install Chromium for synthetic browser tests
        run: pnpm --filter @career/api exec playwright install --with-deps chromium
      - name: Verify assisted applications against fictional fixtures
        run: pnpm run test:assisted
        env:
          CAREER_ASSIST_TEST_ADMIN_URL: postgresql://postgres:career_ci_only@127.0.0.1:5432/postgres
      - run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  platform-build:
    name: Build and domain tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm run typecheck
      - run: pnpm run test:unit
