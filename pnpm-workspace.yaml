packages:
  - apps/*
  - packages/*
# The local launcher installs missing dependencies with the frozen lockfile.
# Do not let pnpm reinstall them before the launcher can coordinate startup.
verifyDepsBeforeRun: false
allowBuilds:
  esbuild: true

# Drizzle's legacy loader otherwise pulls the vulnerable esbuild development server.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
